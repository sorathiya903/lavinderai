<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upgrade Required - LavinderAI</title>

    <meta name="description"
          content="Upgrade to LavinderAI Pro to access chatbot statistics and analytics.">

    <link rel="icon" type="image/webp"
          href="{{ url_for('static', filename='icon.webp') }}">

    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: min(90%, 450px);
            text-align: center;
            padding: 40px 25px;
            border-radius: 18px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            color: #7c4dff;
            margin-bottom: 10px;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #7c4dff;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: 600;
        }

        .btn:hover {
            background: #6a3df0;
        }

        .back {
            display: block;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">📊</div>

    <h1>Upgrade Required</h1>

    <p>
        Chatbot statistics and analytics are available only on the
        <strong>Pro Plan</strong>.
    </p>

    
    <a href="/pricing" class="btn">
        Upgrade to Pro
    </a>

    <a href="/dashboard" class="back">
        Back to Dashboard
    </a>

</div>

</body>
</html>
